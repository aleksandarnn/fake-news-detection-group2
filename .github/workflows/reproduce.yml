name: reproduce

# Proves the committed results are reproducible: installs the core
# dependencies, re-runs every linear experiment from scratch, and fails if any
# metric drifts from the value reported in the README.
#
# The DistilBERT experiment is not run here — it needs torch and several
# minutes of compute. Its metrics are checked for presence only.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dataset loads and splits are the expected size
        run: python -m src.data

      - name: Re-run every linear experiment
        run: python -m src.baselines --quick

      - name: Figures regenerate
        run: python -m src.figures

      - name: Metrics match the README
        run: python -m tests.check_metrics
